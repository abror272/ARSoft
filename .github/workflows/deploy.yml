name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Paketlarni o'rnatish
        run: npm ci

      - name: Build (nisbiy yo'llar bilan)
        run: npm run build -- --base=./

      - name: Dist papkasini yuklash
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'ga chiqarish
        id: deployment
        uses: actions/deploy-pages@v4
